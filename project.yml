name: LiushuCreationHall
options:
  bundleIdPrefix: com.naicheng
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LiushuCreationHall:
    type: application
    platform: iOS
    sources:
      - path: LiushuCreationHall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naicheng.liushucreationhall
        PRODUCT_NAME: LiushuCreationHall
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LiushuCreationHall/Info.plist
      properties:
        CFBundleDisplayName: 六書造字堂
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LiushuCreationHallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiushuCreationHallTests
    dependencies:
      - target: LiushuCreationHall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LiushuCreationHallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LiushuCreationHallUITests
    dependencies:
      - target: LiushuCreationHall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LiushuCreationHall
schemes:
  LiushuCreationHall:
    build:
      targets:
        LiushuCreationHall: all
        LiushuCreationHallTests: [test]
    test:
      targets:
        - LiushuCreationHallTests
        - LiushuCreationHallUITests
